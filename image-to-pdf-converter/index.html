<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지를 PDF로 변환</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            background: #f5f5f5;
        }

        .preview-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: bold;
            line-height: 1;
        }

        .remove-btn:hover {
            background: rgba(255, 59, 48, 1);
            transform: scale(1.1);
        }

        .image-name {
            padding: 8px;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: white;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .convert-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            justify-content: center;
        }

        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .convert-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #ff3b30;
            color: white;
        }

        .clear-btn:hover {
            background: #e02e24;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .image-count {
            text-align: center;
            margin-bottom: 15px;
            color: #667eea;
            font-weight: 600;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .upload-area {
                padding: 40px 15px;
            }

            .preview-container {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 이미지를 PDF로 변환</h1>
        <p class="subtitle">이미지 파일을 선택하거나 드래그하여 PDF로 변환하세요</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">이미지를 여기에 드롭하거나 클릭하세요</div>
            <div class="upload-hint">JPG, PNG, GIF, WEBP 등 지원</div>
        </div>

        <input type="file" id="fileInput" accept="image/*" multiple>

        <div id="imageCountDisplay" class="image-count hidden"></div>

        <div id="previewContainer" class="preview-container"></div>

        <div class="controls hidden" id="controls">
            <button class="convert-btn" id="convertBtn">
                <span>📥</span>
                <span>PDF로 변환 및 다운로드</span>
            </button>
            <button class="clear-btn" id="clearBtn">
                <span>🗑️</span>
                <span>모두 지우기</span>
            </button>
        </div>

        <div id="status" class="status hidden"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const controls = document.getElementById('controls');
        const status = document.getElementById('status');
        const imageCountDisplay = document.getElementById('imageCountDisplay');

        let selectedFiles = [];

        // Upload area click
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(file =>
                file.type.startsWith('image/')
            );

            if (imageFiles.length === 0) {
                showStatus('이미지 파일만 업로드할 수 있습니다.', 'error');
                return;
            }

            selectedFiles = [...selectedFiles, ...imageFiles];
            displayPreviews();
            updateImageCount();
            showStatus('', '');
        }

        function displayPreviews() {
            previewContainer.innerHTML = '';

            if (selectedFiles.length === 0) {
                controls.classList.add('hidden');
                imageCountDisplay.classList.add('hidden');
                return;
            }

            controls.classList.remove('hidden');
            imageCountDisplay.classList.remove('hidden');

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="${file.name}">
                        <div class="image-name">${file.name}</div>
                        <button class="remove-btn" onclick="removeImage(${index})">×</button>
                    `;
                    previewContainer.appendChild(previewItem);
                };
                reader.readAsDataURL(file);
            });
        }

        function updateImageCount() {
            const count = selectedFiles.length;
            if (count > 0) {
                imageCountDisplay.textContent = `선택된 이미지: ${count}개`;
                imageCountDisplay.classList.remove('hidden');
            } else {
                imageCountDisplay.classList.add('hidden');
            }
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            displayPreviews();
            updateImageCount();
            if (selectedFiles.length === 0) {
                showStatus('', '');
            }
        }

        // Clear all
        clearBtn.addEventListener('click', () => {
            selectedFiles = [];
            displayPreviews();
            updateImageCount();
            fileInput.value = '';
            showStatus('', '');
        });

        // Convert to PDF
        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) {
                showStatus('먼저 이미지를 선택해주세요.', 'error');
                return;
            }

            convertBtn.disabled = true;
            convertBtn.innerHTML = '<div class="spinner"></div><span>변환 중...</span>';
            showStatus('PDF를 생성하는 중입니다...', 'info');

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const imageData = await readFileAsDataURL(file);

                    // Create image element to get dimensions
                    const img = await loadImage(imageData);

                    // Calculate dimensions to fit page
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();

                    let imgWidth = pdfWidth - 20; // 10mm margin on each side
                    let imgHeight = (img.height * imgWidth) / img.width;

                    // If image is too tall, scale it down
                    if (imgHeight > pdfHeight - 20) {
                        imgHeight = pdfHeight - 20;
                        imgWidth = (img.width * imgHeight) / img.height;
                    }

                    // Center the image
                    const x = (pdfWidth - imgWidth) / 2;
                    const y = (pdfHeight - imgHeight) / 2;

                    if (i > 0) {
                        pdf.addPage();
                    }

                    pdf.addImage(imageData, 'JPEG', x, y, imgWidth, imgHeight);
                }

                // Download PDF
                const fileName = `converted_${new Date().getTime()}.pdf`;
                pdf.save(fileName);

                showStatus(`✅ PDF가 성공적으로 생성되었습니다! (${selectedFiles.length}개 이미지)`, 'success');

                convertBtn.disabled = false;
                convertBtn.innerHTML = '<span>📥</span><span>PDF로 변환 및 다운로드</span>';

            } catch (error) {
                console.error('PDF 생성 오류:', error);
                showStatus('❌ PDF 생성 중 오류가 발생했습니다.', 'error');
                convertBtn.disabled = false;
                convertBtn.innerHTML = '<span>📥</span><span>PDF로 변환 및 다운로드</span>';
            }
        });

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function showStatus(message, type) {
            if (!message) {
                status.classList.add('hidden');
                return;
            }

            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');

            if (type === 'success') {
                setTimeout(() => {
                    status.classList.add('hidden');
                }, 5000);
            }
        }

        // Make removeImage globally accessible
        window.removeImage = removeImage;
    </script>
</body>
</html>
